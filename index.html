<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" defer></script>
    <script src="app.js" defer></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <title>start</title>
</head>

<body>
    <header>

    </header>
    <main>
        <!-- Trigger the Modal -->
        <img class="myImg" src="assets/1.jpg" alt="Snow" style="width:100%;max-width:300px">
        <img class="myImg" src="assets/2.jpg" alt="Snow" style="width:100%;max-width:300px">
        <img class="myImg" src="assets/3.jpg" alt="Snow" style="width:100%;max-width:300px">
        <img class="myImg" src="assets/4.jpg" alt="Snow" style="width:100%;max-width:300px">
        <img class="myImg" src="assets/5.jpg" alt="Snow" style="width:100%;max-width:300px">
        <img class="myImg" src="assets/6.jpg" alt="Snow" style="width:100%;max-width:300px">

        <!-- The Modal -->
        <div id="myModal" class="modal">

            <!-- The Close Button -->
            <span class="close">&times;</span>

            <!-- Modal Content (The Image) -->
            <img class="modal-content" id="img01">

            <!-- prev next -->
            <a class="prev">&#10094;</a>
            <a class="next">&#10095;</a>

            <!-- Modal Caption (Image Text) -->
            <div id="caption"></div>
        </div>


    </main>
    <footer>

    </footer>
</body>

</html>
